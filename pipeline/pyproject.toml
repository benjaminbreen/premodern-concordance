[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "premodern-concordance-pipeline"
version = "0.1.0"
description = "Private authoring and publication pipeline for Premodern Concordance V2"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=2.12.1,<3",
  "numpy>=2,<3",
]

[project.scripts]
premodern = "premodern.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
